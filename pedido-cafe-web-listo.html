<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pedido de café de especialidad</title>
<style>
:root{--bg:#faf6f1;--card:#fff;--tx:#2b1d14;--mu:#7a6a5e;--ac:#7b4a2a;--ac2:#f1e4d6;--bd:#e6d9cb;--ok:#2e7d4f;--wa:#b26a00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1410;--card:#261c16;--tx:#f3e9df;--mu:#b8a898;--ac:#d9a066;--ac2:#3a2a1f;--bd:#3d2e24;--ok:#6fcf97;--wa:#f2b45a}}
:root[data-theme="dark"]{--bg:#1b1410;--card:#261c16;--tx:#f3e9df;--mu:#b8a898;--ac:#d9a066;--ac2:#3a2a1f;--bd:#3d2e24;--ok:#6fcf97;--wa:#f2b45a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:720px;margin:0 auto;padding:16px 14px 120px}
h1{font-size:1.5rem;margin:8px 0 4px}h2{font-size:1.05rem;margin:22px 0 8px}
.mu{color:var(--mu);font-size:.88rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 200px}
label{display:block;font-size:.85rem;color:var(--mu);margin-bottom:3px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.cafe h3{margin:0;font-size:1.02rem}.tag{font-size:.7rem;background:var(--ac);color:var(--bg);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.ft{font-size:.8rem;color:var(--mu);margin:2px 0 8px}
.top{display:flex;gap:12px;align-items:flex-start}.ph{flex:0 0 72px;width:72px;height:72px;border-radius:10px;background:var(--ac2);display:flex;align-items:center;justify-content:center;font-size:1.8rem;overflow:hidden}.ph img{width:100%;height:100%;object-fit:cover}
.sp{display:grid;grid-template-columns:auto 1fr;gap:1px 8px;font-size:.8rem;margin:6px 0 4px}.sp dt{color:var(--mu)}.sp dd{margin:0}
.pr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px dashed var(--bd)}
.pr b{display:block}.st{display:flex;align-items:center;gap:6px}
.st button{width:36px;height:36px;border-radius:10px;border:1px solid var(--bd);background:var(--ac2);color:var(--tx);font-size:1.2rem;cursor:pointer}
.st span{min-width:24px;text-align:center;font-weight:600}
.mol{margin-top:8px;padding-top:8px;border-top:1px dashed var(--bd)}.mol label{display:flex;gap:8px;align-items:center;color:var(--tx);font-size:.92rem}.mol input[type=checkbox]{width:auto}
.mol select{margin-top:6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.bar>div{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{background:var(--ac);color:var(--bg);border:0;border-radius:12px;padding:12px 22px;font:inherit;font-weight:600;cursor:pointer}.btn:disabled{opacity:.5}
.btn.s{background:var(--ac2);color:var(--tx);padding:8px 14px}
.iva{margin:10px 0 0;padding:10px 12px;background:var(--ac);color:var(--bg);border-radius:10px;font-weight:700;text-align:center}
.err{color:#c0392b;font-size:.9rem;margin:8px 0}.wa{color:var(--wa);font-size:.9rem}
table{border-collapse:collapse;width:100%;font-size:.9rem}td,th{padding:6px 4px;text-align:left;border-bottom:1px solid var(--bd)}td.n,th.n{text-align:right;white-space:nowrap}
.ov{overflow-x:auto}.tot{font-size:1.3rem;font-weight:700;color:var(--ok)}
</style>
</head>
<body>
<div class="w" id="app"></div>
<script>
const IVA=0.21;
// precios netos (sin IVA) de la lista mayorista de septiembre 2026
const C=[
["Colombia Manzanares","Manzanares, Caldas · Lavado",45000,13300],
["Perú Orgánico","San Ignacio, Cajamarca · Lavado",41700,12400,"Nuevo"],
["Colombia Guayacán","Eje Cafetero · Lavado",40700,12200,"Próximamente",1],
["Brasil Arara","Mantiqueira, Minas Gerais · Natural",43600,13100,"Nuevo"],
["Blend Paraíso","Brasil / Colombia · Natural",43600,13000],
["Blend Cósmico","Perú / Colombia · Lavado / Natural",43500,12200],
["Blend Fuego","Brasil / Bolivia · Natural / Lavado",42300,14400],
["Colombia Descafeinado","Belén de Umbría · Descafeinado",41600,12100],
["Colombia Finca Los Girasoles","San Antonio, Tolima · Black Honey",51500,16800],
["Finca La Fantasía","Cauca, Colombia · Natural",50000,15800],
["Brasil","Mantiqueira, Minas Gerais · Natural",42200,14200],
["Bolivia El Porvenir","Yanacachi · Lavado",40400,13600,"Nuevo"],
["Bolivia Regional","Illampu, Caranavi · Lavado",37500,13100]
];
const SP=[
["Colombia","Manzanares, Caldas","Castilla, Colombia, Caturra","Lavado","Manual","1000-1900 msnm"],
["Perú","San Ignacio, Cajamarca","Catuai, Caturra, Bourbon y Mundo Novo","Lavado","Manual","1200-1500 msnm"],
["Colombia","Eje Cafetero","Castillo","Lavado","Manual","1.600 msnm"],
["Brasil","Mantiqueira, Minas Gerais","Arara","Natural","Manual","1.200-1.400 msnm"],
["Brasil / Colombia","Mantiqueira / Minas Gerais","Catuai Rojo / Castillo, Caturra","Natural","Manual","1.100-1.800 msnm"],
["Perú / Colombia","Jaén Cajamarca / Cauca","Blend de Varietales / Caturra Castillo","Lavado / Natural","Manual","1.200-1.800 msnm"],
["Brasil / Bolivia","Mantiqueira / Illampu","Catuaí rojo / Caturra","Natural / Lavado","Manual","1.100-1.400 msnm"],
["Colombia","Belén de Umbría","Caturra","Descafeinado","Manual","1.600 msnm"],
["Colombia","San Antonio, Tolima","Caturra","Black Honey","Manual","2.100 msnm"],
["Colombia","Cauca","Castillo, Caturra","Natural","Manual","1.800 msnm"],
["Brasil","Mantiqueira, Minas Gerais","Catuaí Rojo","Natural","Manual","1.100-1.300 msnm"],
["Bolivia","Yanacachi","Catuai, Typica","Lavado","Manual","1.500 msnm"],
["Bolivia","Illampu, Caranavi","Catuaí, Caturra","Lavado","Manual","1.200-1.400 msnm"]];
const SL=["Origen","Región","Variedad","Beneficio","Recolección","Altura"];
const K=[["Caja Triple (3 bolsas de 250 g)",70600],["Caja Múltiple (4 bolsas de 250 g)",85000],["Caja Combinada (2 bolsas de 250 g)",46600]];
const MOL=["Espresso","Filtro","Prensa francesa"];
const $=s=>document.querySelector(s);
const money=n=>"$ "+Math.round(n).toLocaleString("es-AR");
const withIva=n=>Math.round(n*(1+IVA));
const q={}; const mol={}; // q[key]=qty ; mol[cafeIdx]={on,t}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const URL_SHEETS="https://script.google.com/a/macros/folken.com.ar/s/AKfycbx7LsZr7Ead4FqxeZKwHuefzOJJXoLGrNVD_iwHiPJt9etWZPZ75ZUUyAVufPV__dngDg/exec"; // ver instrucciones
let sent=null;

function lines(){
  const L=[];
  C.forEach((c,i)=>{[["250 g",c[3],"a"],["1 kg",c[2],"k"]].forEach(([p,pr,k])=>{
    const n=q[i+k]||0; if(n){const m=mol[i]||{};L.push({cafe:c[0],pres:p,cant:n,molienda:m.on?m.t:"Grano entero",net:pr,unit:withIva(pr),sub:withIva(pr)*n,ci:i,k})}})});
  K.forEach((c,i)=>{const n=q["x"+i]||0;if(n)L.push({cafe:"Club de café: "+c[0],pres:"Caja",cant:n,molienda:"-",net:c[1],unit:withIva(c[1]),sub:withIva(c[1])*n,ci:-1,k:"x"})});
  return L}
function totals(L){const net=L.reduce((s,l)=>s+l.net*l.cant,0);const total=L.reduce((s,l)=>s+l.sub,0);return{net,total,iva:total-net}}
function avisos(L){const w=[];
  const u250=L.filter(l=>l.pres==="250 g").reduce((s,l)=>s+l.cant,0);
  if(u250>0&&u250<24)w.push("El mínimo de envío para bolsas de 250 g es de 24 unidades (llevás "+u250+").");
  L.filter(l=>l.pres==="1 kg"&&l.cant<6).forEach(l=>w.push("1 kg de "+l.cafe+": el mínimo es 6 kg del mismo origen."));
  return w}

function render(){
  if(sent){return renderDone()}
  let h=`<h1>☕ Bienvenidos al Club de Café</h1>
  <div class="mu">Lista de precios: Septiembre 2026</div>
  <div class="iva">Todos los precios incluyen IVA (21%)</div>
  <h2>Tus datos</h2><div class="card"><div class="row">
  <div><label>Nombre y apellido</label><input id="nom" autocomplete="name"></div>
  <div><label>Teléfono</label><input id="tel" type="tel" autocomplete="tel" inputmode="tel"></div></div></div>
  <h2>Cafés</h2>`;
  C.forEach((c,i)=>{const off=c[5];const m=mol[i]||{};const has=(q[i+"a"]||0)+(q[i+"k"]||0)>0;
    h+=`<div class="card cafe"${off?' style="opacity:.55"':""}><div class="top"><div><h3>${esc(c[0])}${c[4]?`<span class="tag">${c[4]}</span>`:""}</h3><dl class="sp">${SP[i].map((v,n)=>`<dt>${SL[n]}</dt><dd>${esc(v)}</dd>`).join("")}</dl></div></div>`;
    if(off)h+=`<div class="mu">Todavía no disponible para pedir.</div>`;
    else{[["250 g",c[3],"a"],["1 kg",c[2],"k"]].forEach(([p,pr,k])=>{h+=`<div class="pr"><div><b>${p}</b><span class="mu">${money(withIva(pr))}</span></div><div class="st"><button data-k="${i+k}" data-d="-1" aria-label="Menos">−</button><span>${q[i+k]||0}</span><button data-k="${i+k}" data-d="1" aria-label="Más">+</button></div></div>`});
      if(has)h+=`<div class="mol"><label><input type="checkbox" data-m="${i}" ${m.on?"checked":""}> Lo quiero molido</label>${m.on?`<select data-mt="${i}">${MOL.map(o=>`<option ${m.t===o?"selected":""}>${o}</option>`).join("")}</select>`:""}</div>`}
    h+="</div>"});
  h+=`<h2>Club de café</h2>`;
  K.forEach((c,i)=>{h+=`<div class="card"><div class="pr" style="border:0"><div><b>${esc(c[0])}</b><span class="mu">${money(withIva(c[1]))} · incluye ficha técnica y recetario</span></div><div class="st"><button data-k="x${i}" data-d="-1">−</button><span>${q["x"+i]||0}</span><button data-k="x${i}" data-d="1">+</button></div></div></div>`});
  h+=`<div id="err" class="err"></div>`;
  const L=lines(),T=totals(L);
  h+=`<div class="bar"><div><div><div class="mu">Total (IVA 21% incluido)</div><b id="tt" style="font-size:1.2rem">${money(T.total)}</b></div><button class="btn" id="send">Enviar pedido</button></div></div>`;
  const keep={nom:$("#nom")?.value,tel:$("#tel")?.value};
  $("#app").innerHTML=h;
  ["nom","tel"].forEach(k=>{if(keep[k])$("#"+k).value=keep[k]});
  document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const k=b.dataset.k;q[k]=Math.max(0,(q[k]||0)+ +b.dataset.d);const i=parseInt(k);if(!isNaN(i)&&!(q[i+"a"]||0)&&!(q[i+"k"]||0))delete mol[i];render()});
  document.querySelectorAll("[data-m]").forEach(b=>b.onchange=()=>{mol[b.dataset.m]={on:b.checked,t:(mol[b.dataset.m]||{}).t||MOL[0]};render()});
  document.querySelectorAll("[data-mt]").forEach(b=>b.onchange=()=>{mol[b.dataset.mt].t=b.value});
  $("#send").onclick=submit;
}

async function submit(){
  const nom=$("#nom").value.trim(),tel=$("#tel").value.trim(),e=$("#err");
  const L=lines();
  if(!nom||!tel){e.textContent="Completá nombre y apellido, y teléfono.";$("#nom").scrollIntoView();return}
  if(tel.replace(/\D/g,"").length<8){e.textContent="Revisá el teléfono.";return}
  if(!L.length){e.textContent="Elegí al menos un producto.";return}
  const T=totals(L),w=avisos(L),b=$("#send");b.disabled=true;b.textContent="Enviando…";
  const o={fecha:new Date().toISOString(),nombre:nom,telefono:tel,items:L.map(({cafe,pres,cant,molienda,unit,sub})=>({cafe,pres,cant,molienda,unit,sub})),neto:T.net,iva:T.iva,total:T.total,avisos:w.join(" | ")};
  try{
    if(URL_SHEETS.indexOf("https://")!==0)throw new Error("falta configurar la planilla");
    await fetch(URL_SHEETS,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(o)});
    sent={o,w}; render();
  }catch(x){e.textContent="No se pudo enviar el pedido ("+(x.code||x.message)+"). Probá de nuevo.";b.disabled=false;b.textContent="Enviar pedido"}
}

function renderDone(){
  const {o,w}=sent;
  $("#app").innerHTML=`<h1>✅ ¡Pedido enviado!</h1><div class="mu">Gracias, ${esc(o.nombre)}. Nos vamos a comunicar al ${esc(o.telefono)}.</div>
  <div class="card ov"><table><tr><th>Producto</th><th class="n">Cant.</th><th class="n">Subtotal</th></tr>
  ${o.items.map(i=>`<tr><td>${esc(i.cafe)} · ${i.pres}<br><span class="mu">${i.molienda==="Grano entero"||i.molienda==="-"?(i.molienda==="-"?"":"Grano entero"):"Molido: "+esc(i.molienda)}</span></td><td class="n">${i.cant}</td><td class="n">${money(i.sub)}</td></tr>`).join("")}
  </table>
  <p class="mu" style="margin:10px 0 2px">Neto: ${money(o.neto)} · IVA 21%: ${money(o.iva)}</p>
  <div class="tot">Total: ${money(o.total)}</div><div class="mu">Importe final con IVA (21%) incluido.</div></div>
  <div class="card pago"><p style="margin:0 0 10px">Para finalizar, podés realizar tu transferencia al alias <b>camilo.herzovich</b> y enviar el comprobante al siguiente WhatsApp:</p>
  <a class="btn" style="display:inline-block;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/5491166112244?text=${encodeURIComponent("Hola, soy "+o.nombre+". Te envío el comprobante de mi pedido por "+money(o.total)+".")}">💬 WhatsApp +54 11 6611-2244</a></div>
  <p><button class="btn s" id="nuevo">Hacer otro pedido</button></p>`;
  $("#nuevo").onclick=()=>{sent=null;Object.keys(q).forEach(k=>delete q[k]);Object.keys(mol).forEach(k=>delete mol[k]);render()};
  
}

render();
</script>
</body>
</html>
